<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font-family: system-ui, sans-serif; max-width: 560px; margin: 2rem auto; padding: 0 1rem; color: #1f2328; }
    h1 { display: flex; align-items: center; gap: .6rem; font-size: 20px; }
    h1 img { width: 32px; height: 32px; }
    label { display: block; font-weight: 600; margin: 1.2rem 0 .3rem; }
    textarea { width: 100%; padding: 6px; font-family: monospace; box-sizing: border-box; }
    p.muted { color: #57606f; font-size: 13px; }
    button { margin-top: 1rem; padding: 6px 18px; font-size: 14px; background: #FC6D26; color: #fff; border: 0; border-radius: 6px; cursor: pointer; }
    #status { margin-left: .8rem; }
  </style>
</head>
<body>
  <h1><img src="icons/icon.svg" alt=""> GitLab RST Enhanced</h1>
  <p class="muted">Hostnames are only needed to limit where the extension runs.
  If the list is empty, it runs on every GitLab-looking site you visit.</p>
  <label><input type="checkbox" id="enabled"> Enable RST enhancement</label>
  <label for="hosts">GitLab hosts (one per line, e.g. gitlab.example.com)</label>
  <textarea id="hosts" rows="6"></textarea>
  <br>
  <button id="save">Save</button><span id="status" class="muted"></span>
  <script src="options.js"></script>
</body>
</html>
