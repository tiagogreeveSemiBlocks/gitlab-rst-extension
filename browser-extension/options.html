<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>GitLab RST Enhanced - Settings</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 560px; margin: 2rem auto; padding: 0 1rem; color: #1f2328; }
    h1 { font-size: 20px; margin: 0 0 1rem; color: #e24329; }
    label { display: block; font-weight: 600; margin: 1.2rem 0 .3rem; }
    textarea { width: 100%; padding: 6px; font-family: monospace; box-sizing: border-box; }
    p.muted { color: #57606f; font-size: 13px; }
    button { margin-top: 1rem; padding: 6px 18px; font-size: 14px; background: #FC6D26; color: #fff; border: 0; border-radius: 6px; cursor: pointer; }
    #status { margin-left: .8rem; }
    .error { color: #cf222e; }
  </style>
</head>
<body>
  <noscript><p class="error">JavaScript must be enabled to use this page.</p></noscript>
  <h1>GitLab RST Enhanced - Settings</h1>

  <p class="muted">Hostnames are only needed to limit where the extension
  runs. If the list is empty, it runs on every GitLab-looking site you
  visit.</p>

  <label><input type="checkbox" id="enabled"> Enable RST enhancement</label>

  <label for="hosts">GitLab hosts (one per line, e.g. gitlab.example.com)</label>
  <textarea id="hosts" rows="6" placeholder="gitlab.example.com"></textarea>

  <div>
    <button id="save" type="button">Save</button>
    <span id="status" class="muted"></span>
  </div>

  <script src="options.js"></script>
</body>
</html>
