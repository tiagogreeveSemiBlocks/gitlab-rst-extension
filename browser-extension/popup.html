<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <h1>GitLab RST Enhanced</h1>
  <p class="host" id="host"></p>
  <div id="needs-permission" hidden>
    <p class="muted">Content script blocked by Firefox optional host
    permissions. Grant access, then reload GitLab tabs.</p>
    <button id="grant">Grant access to all sites</button>
  </div>
  <label class="row">
    <input type="checkbox" id="enabled">
    Enable RST enhancement
  </label>
  <button id="toggle-host" class="secondary"></button>
  <p class="muted" id="status"></p>
  <script src="popup.js"></script>
</body>
</html>
